name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run build
      - name: Validate PR commits and squash title
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          printf '%s\n' "$PR_TITLE" | npx --no-install commitlint

  deploy:
    name: deploy
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 배포 파일 빌드
        run: |
          npm ci
          npm prune --omit=dev --ignore-scripts
          test -f dist/index.js
          zip -qr deploy.zip package.json package-lock.json dist node_modules .ebextensions .platform

      - name: AWS 권한 연결
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-northeast-2

      - name: Elastic Beanstalk 배포
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ap-northeast-2
          application-name: pot-be
          environment-name: pot-be-env
          version-label: ${{ github.sha }}
          deployment-package-path: deploy.zip
          use-existing-application-version-if-available: true
